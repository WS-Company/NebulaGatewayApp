name: NebulaGateway

options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.3"
  groupSortPosition: top

settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  DEVELOPMENT_TEAM: 5X73B47284
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "Developer ID Application"

targets:
  NebulaGateway:
    type: application
    platform: macOS
    sources:
      - path: NebulaGateway
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nebulagateway.app
      INFOPLIST_FILE: NebulaGateway/Info.plist
      CODE_SIGN_ENTITLEMENTS: NebulaGateway/NebulaGateway.entitlements
      PRODUCT_NAME: Nebula Gateway
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      LS_UI_ELEMENT: true
      ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - target: NebulaGatewayHelper
    postBuildScripts:
      - name: "Embed Helper, nebula and LaunchDaemon plist"
        script: |
          set -e
          APP="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
          # Copy LaunchDaemon plist
          mkdir -p "${APP}/Contents/Library/LaunchDaemons"
          cp "${SRCROOT}/NebulaGatewayHelper/launchd.plist" "${APP}/Contents/Library/LaunchDaemons/com.nebulagateway.helper.plist"
          # Official nebula from tools/fetch-nebula.sh, kept as signed by Defined Networking.
          # The helper runs it only if its sha256 matches BundledNebula.swift, so the build checks the same.
          VENDOR="${SRCROOT}/Vendor/nebula"
          if [ ! -f "${VENDOR}/nebula" ] || [ ! -f "${VENDOR}/nebula-cert" ]; then
            echo "error: ${VENDOR} is missing nebula; run tools/fetch-nebula.sh"
            exit 1
          fi
          EXPECTED=$(sed -n 's/.*sha256 = "\([0-9a-f]*\)".*/\1/p' "${SRCROOT}/NebulaGatewayHelper/BundledNebula.swift")
          ACTUAL=$(shasum -a 256 "${VENDOR}/nebula" | cut -d' ' -f1)
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "error: ${VENDOR}/nebula sha256 ${ACTUAL} does not match BundledNebula.sha256 ${EXPECTED}"
            exit 1
          fi
          mkdir -p "${APP}/Contents/Helpers"
          cp "${VENDOR}/nebula" "${VENDOR}/nebula-cert" "${APP}/Contents/Helpers/"
          # Copy helper binary into app bundle
          cp "${BUILT_PRODUCTS_DIR}/com.nebulagateway.helper" "${APP}/Contents/MacOS/com.nebulagateway.helper"
          # Re-sign helper inside the bundle (must preserve identifier for XPC)
          codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --identifier "com.nebulagateway.helper" --entitlements "${SRCROOT}/NebulaGatewayHelper/NebulaGatewayHelper.entitlements" "${APP}/Contents/MacOS/com.nebulagateway.helper"
          # Re-sign the entire app bundle (seal was broken by adding files)
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --entitlements "${SRCROOT}/NebulaGateway/NebulaGateway.entitlements" "${APP}"

  NebulaGatewayHelper:
    type: tool
    platform: macOS
    sources:
      - path: NebulaGatewayHelper
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nebulagateway.helper
      INFOPLIST_FILE: NebulaGatewayHelper/Info.plist
      CODE_SIGN_ENTITLEMENTS: NebulaGatewayHelper/NebulaGatewayHelper.entitlements
      PRODUCT_NAME: com.nebulagateway.helper
      SKIP_INSTALL: true
      ENABLE_HARDENED_RUNTIME: true

  # Logic tests without a host app: they compile the pure files directly.
  NebulaGatewayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NebulaGatewayTests
      - path: NebulaGatewayHelper/RunPath.swift
      - path: NebulaGateway/Models/ConnectionConfig.swift
      - path: NebulaGateway/Models/AppConfiguration.swift
      - path: NebulaGateway/Services/TOMLCoding.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nebulagateway.tests
      GENERATE_INFOPLIST_FILE: true
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""

schemes:
  NebulaGatewayTests:
    build:
      targets:
        NebulaGatewayTests: [test]
    test:
      targets:
        - NebulaGatewayTests
